# ============================================================
# Kitty 终端美观配置 (保留字体设置)
# ============================================================
# 使用方法：将内容追加或替换到 ~/.config/kitty/kitty.conf
# 如需保留原字体,请确保下方字体相关行保持注释状态（已默认注释）
# 若想调整透明度/模糊等,请根据注释修改对应数值

# ---------- 字体保留（不修改,使用你当前配置或系统默认） ----------
font_size 16
font_family JetBrainsMonoSlashed
bold_font        auto
italic_font      auto
bold_italic_font auto
background #000000

# ---------- 配色方案：Catppuccin Mocha (柔和护眼,高对比) ----------

# 背景半透明 (0.92 = 轻微透明,数值越小越透明)
background_opacity    0.92
# 允许动态调节透明度（需要下面映射快捷键）
dynamic_background_opacity yes
# 背景模糊强度（macOS/Wayland有效,0为关闭）
background_blur       12

selection_foreground  #1e1e2e
selection_background  #f5e0dc
cursor                #f5e0dc
cursor_text_color     #1e1e2e

# 16色基本调色板 (柔和且鲜艳)
color0   #45475a
color1   #f38ba8
color2   #3c6450
color3   #f9e2af
color4   #89b4fa
color5   #f5c2e7
color6   #94e2d5
color7   #bac2de
color8   #585b70
color9   #f38ba8
color10  #3c6450
color11  #f9e2af
color12  #89b4fa
color13  #f5c2e7
color14  #94e2d5
color15  #cdd6f4

# ---------- 光标: 细光束 + 酷炫尾迹 ----------
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval -1
# 开启光标尾迹（毫秒触发阈值）
cursor_trail          250
# 尾迹衰减速度
cursor_trail_decay    0.4 0.8
# 尾迹颜色
cursor_trail_color    #00ff00

# ---------- 窗口与边框: 圆润留白 ----------
# 文字与边框间距
window_padding_width  8
# 窗口外边框空白
window_margin_width   0
window_border_width   1.0pt
# 激活窗口边框颜色
active_border_color   #cba6f7
# 非激活窗口边框颜色
inactive_border_color #313244
draw_minimal_borders  no
# 单窗口时的内边距
single_window_padding_width  8

# ---------- 滚动条: 现代半透明圆角 ----------
scrollbar             always
# 宽度（单元格倍数）
scrollbar_width       0.8
scrollbar_radius      0.5
scrollbar_handle_opacity 0.7
scrollbar_track_opacity   0.1
scrollbar_handle_color    #cba6f7
scrollbar_track_color     #313244

# ---------- 鼠标与交互 ----------
# 2秒无操作隐藏鼠标
mouse_hide_wait       2.0
url_color             #89b4fa
url_style             curly
click_interval        -1.0
focus_follows_mouse   no

# ---------- 性能与平滑滚动 ----------
repaint_delay         10
input_delay           3
sync_to_monitor        yes
wheel_scroll_multiplier 5.0
touch_scroll_multiplier  1.2
momentum_scroll       0.96

# ---------- 增强功能 ----------
shell_integration      enabled
# 命令完成时弹通知（未聚焦且运行>5秒）
notify_on_cmd_finish   unfocused 5 notify
clear_selection_on_clipboard_loss yes

# ---------- 快捷键 ----------
# 透明度调节（需要 dynamic_background_opacity = yes）
map ctrl+shift+a>m    set_background_opacity +0.05
map ctrl+shift+a>l    set_background_opacity -0.05
map ctrl+shift+a>d    set_background_opacity default
# 重新加载配置
map ctrl+shift+f5     load_config_file
# 命令面板
map ctrl+shift+f3     command_palette
# 快速打开 URL
map ctrl+shift+e      kitten hints --type url --program -

# ---------- 可选：背景图片（若想使用图片可取消注释并替换路径）----------
# background_image      ~/Pictures/kitty-bg.png
# background_image_layout scaled
# background_tint       0.3
