<!DOCTYPE html>
<!--
  是什么: 唯一的页面。左栏目录/文件列表, 右栏看图或看文本。
  为什么: 全部数据都靠 fetch 调 /api/list、/api/text 拿 JSON, 页面本身是静态的,
          所以不需要模板引擎; 翻页顺序直接用后端返回的 image 条目顺序, 前端不重复判断后缀。
  元信息: tempest, 2026-10-12。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片浏览</title>
<style>
  :root { --line: #d8d8d8; --muted: #777; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 14px/1.5 system-ui, "Noto Sans CJK SC", sans-serif; color: #222;
  }
  header { padding: 8px 12px; border-bottom: 1px solid var(--line); flex: none; }
  #crumbs a { color: #06c; text-decoration: none; margin-right: 4px; }
  #crumbs span { color: var(--muted); margin-right: 4px; }
  main { flex: 1; display: flex; min-height: 0; }
  aside { width: 320px; flex: none; overflow: auto; border-right: 1px solid var(--line); }
  .row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 10px; cursor: pointer; border-bottom: 1px solid #f2f2f2;
  }
  .row:hover { background: #f0f6ff; }
  .row.active { background: #dceaff; }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .size { color: var(--muted); font-size: 12px; }
  .row.dir .name { font-weight: 600; }
  .row.other { color: var(--muted); }
  .thumb { width: 44px; height: 34px; object-fit: cover; background: #f4f4f4; flex: none; }
  #view { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #stage {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    background: #1b1b1b; overflow: auto; padding: 8px;
  }
  #stage.plain { background: #fff; display: block; }
  #img { max-width: 100%; max-height: 100%; cursor: zoom-in; }
  #text { margin: 0; white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, monospace; }
  #hint { color: #bbb; }
  #pager {
    flex: none; display: flex; align-items: center; gap: 12px; justify-content: center;
    padding: 8px; border-top: 1px solid var(--line);
  }
  button { padding: 4px 14px; font-size: 14px; }
  #meta { color: var(--muted); padding: 0 12px; font-size: 12px; max-width: 40%; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<header id="crumbs"></header>
<main>
  <aside id="list"></aside>
  <section id="view">
    <div id="stage"><div id="hint">← 左侧选择文件</div><img id="img" hidden alt=""><pre id="text" hidden></pre></div>
    <div id="pager" hidden>
      <button id="prev">上一张</button>
      <span id="counter"></span>
      <button id="next">下一张</button>
      <span id="meta"></span>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
// state.images  当前目录下所有图片的路径, 顺序 = 后端给的顺序 = 翻页顺序
// state.idx     当前显示的是第几张(下标, 从 0 起)
// state.mode    "image" / "text" / null, 决定方向键和翻页按钮是否生效
const state = { images: [], idx: -1, mode: null };

// 每段路径单独编码: encodeURIComponent 会把 "/" 也编码掉, 只有分段处理才能保留层级。
function encodePath(p) { return p.split("/").map(encodeURIComponent).join("/"); }

function humanSize(n) {
  const units = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + units[i];
}

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error((await res.text()) || res.statusText);
  return res.json();
}

async function loadDir(path) {
  const data = await getJSON("/api/list?path=" + encodeURIComponent(path));
  state.images = data.entries.filter((e) => e.type === "image").map((e) => e.path);
  $("crumbs").innerHTML = "";
  data.crumbs.forEach((crumb, i) => {
    if (i) $("crumbs").append(document.createTextNode("/"));
    const a = document.createElement("a");
    a.textContent = crumb.name;
    a.href = "javascript:void(0)";
    a.onclick = () => loadDir(crumb.path);
    $("crumbs").append(a);
  });
  const info = document.createElement("span");
  info.textContent = `(${data.entries.length} 项, ${data.total_images} 张图)`;
  $("crumbs").append(info);
  renderList(data.entries);
  clearViewer();
  // 把当前目录写进地址栏, 刷新后还在同一层。
  history.replaceState(null, "", "?dir=" + encodeURIComponent(data.path));
}

function renderList(entries) {
  const box = $("list");
  box.innerHTML = "";
  for (const entry of entries) {
    const row = document.createElement("div");
    row.className = "row " + entry.type;
    row.dataset.path = entry.path;
    if (entry.type === "image") {
      // 缩略图就是原图, 交给浏览器缩小; loading=lazy 保证只加载可视区域内的图。
      const img = document.createElement("img");
      img.className = "thumb";
      img.loading = "lazy";
      img.src = "/media/" + encodePath(entry.path);
      row.append(img);
    } else {
      const icon = document.createElement("span");
      icon.textContent = entry.type === "dir" ? "📁" : entry.type === "text" ? "📄" : "📦";
      row.append(icon);
    }
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = entry.name;
    row.append(name);
    if (entry.size != null) {
      const size = document.createElement("span");
      size.className = "size";
      size.textContent = humanSize(entry.size);
      row.append(size);
    }
    row.onclick = () => {
      if (entry.type === "dir") loadDir(entry.path);
      else if (entry.type === "image") showImage(state.images.indexOf(entry.path));
      else if (entry.type === "text") showText(entry);
      else window.open("/media/" + encodePath(entry.path), "_blank");
    };
    box.append(row);
  }
}

function clearViewer() {
  state.idx = -1;
  state.mode = null;
  $("img").hidden = true;
  $("img").removeAttribute("src");
  $("text").hidden = true;
  $("text").textContent = "";
  $("hint").hidden = false;
  $("pager").hidden = true;
  $("stage").className = "";
  markActive(null);
}

function showImage(index) {
  if (index < 0 || index >= state.images.length) return;
  state.idx = index;
  state.mode = "image";
  const path = state.images[index];
  const img = $("img");
  img.src = "/media/" + encodePath(path);
  img.hidden = false;
  $("text").hidden = true;
  $("hint").hidden = true;
  $("stage").className = "";
  $("pager").hidden = false;
  $("counter").textContent = (index + 1) + " / " + state.images.length;
  $("meta").textContent = path;
  markActive(path);
}

async function showText(entry) {
  const data = await getJSON("/api/text?path=" + encodeURIComponent(entry.path));
  state.idx = -1;
  state.mode = "text";
  $("img").hidden = true;
  $("text").textContent = data.content + (data.truncated ? "\n\n…(文件过大, 只显示前 1 MB)" : "");
  $("text").hidden = false;
  $("hint").hidden = true;
  $("stage").className = "plain";
  $("pager").hidden = false;
  $("counter").textContent = humanSize(data.size);
  $("meta").textContent = data.path;
  markActive(data.path);
}

function markActive(path) {
  for (const row of document.querySelectorAll(".row")) {
    row.classList.toggle("active", row.dataset.path === path && path !== null);
  }
}

function step(delta) {
  if (state.mode !== "image") return;
  // 到头部/尾部就停住, 不循环: 循环翻页会让人分不清看到第几遍。
  showImage(Math.min(state.images.length - 1, Math.max(0, state.idx + delta)));
}

$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("img").onclick = () => step(1);          // 点图下一张
$("img").onwheel = (e) => { e.preventDefault(); step(e.deltaY > 0 ? 1 : -1); };
document.onkeydown = (e) => {
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); step(1); }
  else if (e.key === "Escape") clearViewer();
};

// 入口: 从地址栏读目录(支持直接分享某层的链接), 没带参数就从根目录开始。
loadDir(new URLSearchParams(location.search).get("dir") || "").catch((err) => {
  $("list").textContent = "加载失败: " + err.message;
});
</script>
</body>
</html>
